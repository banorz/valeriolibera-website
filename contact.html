---
layout: default
title: pages.contact
permalink: /contact/
---

<script>
  function send(){
    var yourname = document.getElementById("name").value;
    var yournum = document.getElementById("tel").value;
    var yourmail = document.getElementById("mail").value;
    var yourmessage = document.getElementById("body").value;
    var subject = "INFO - " + yourmail;
    var body = encodeURIComponent(yourmessage + "\n\n" + yourname + "\n" + yournum + "\n" + yourmail);
    window.open('mailto:info@valeriolibera.it?subject=' + subject + '&body=' + body);
  }
</script>

<div class="contact-layout">
  <!-- Left Side: Styled Tech Form -->
  <div class="contact-form-box">
    <h3 style="font-size: 1.1em; margin-bottom: 20px;">[ SEND_MESSAGE ]</h3>
    
    <div class="form-group">
      <label for="name">{% t contact.yourname %}</label>
      <input class="contact-field" id="name" placeholder="Mario Rossi" type="text">
    </div>
    
    <div class="form-group">
      <label for="tel">{% t contact.yournumber %}</label>
      <input class="contact-field" id="tel" placeholder="+39 33333333" type="tel">
    </div>
    
    <div class="form-group">
      <label for="mail">{% t contact.yourmail %}</label>
      <input class="contact-field" id="mail" placeholder="mail@mail.com" type="email">
    </div>
    
    <div class="form-group">
      <label for="body">{% t contact.message %}</label>
      <textarea id="body" rows="6" placeholder="{% t contact.emailmessage %}"></textarea>
    </div>
    
    <button class="contact-btn" onclick="send()">{% t contact.send %}</button>
  </div>

  <!-- Right Side: Details & Coordinates -->
  <div class="contact-details">
    <div class="info-box" style="margin-bottom: 0;">
      <h3 style="font-size: 1.1em; margin-bottom: 20px;">[ COORDINATES ]</h3>
      
      <div style="display: flex; flex-direction: column; gap: 15px;">
        <div class="contact-item">
          <img class="icon-contact" src='{{ "/assets/images/ic_phone.png" | prepend: site.baseurl_root }}' alt="Phone">
          <a href="tel:+393456024345">+39 3456024345</a>
        </div>
        
        <div class="contact-item">
          <img class="icon-contact" src='{{ "/assets/images/ic_mail.png" | prepend: site.baseurl_root }}' alt="Email">
          <a href="mailto:contact@valeriolibera.it">contact@valeriolibera.it</a>
        </div>
        
        <div class="contact-item">
          <img class="icon-contact" src='{{ "/assets/images/ic_location.png" | prepend: site.baseurl_root }}' alt="Location">
          <a href="https://maps.app.goo.gl/LkPqkbTVvy7KBYYe8" target="_blank">00181 - Roma - Furio Camillo</a>
        </div>
      </div>

      <div style="border-top: 1px solid var(--border-muted); margin-top: 25px; padding-top: 20px;">
        <span style="font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); display: block; margin-bottom: 12px;">
          - network.presence
        </span>
        <div class="social-links">
          <a href="https://facebook.com/{{ site.facebook_pagename }}" target="_blank">
            <img class="icon-social" src='{{ "/assets/images/facebook.png" | prepend: site.baseurl_root }}' alt="Facebook">
          </a>
          <a href="https://twitter.com/{{ site.twitter_pagename }}" target="_blank">
            <img class="icon-social" src='{{ "/assets/images/twitter.png" | prepend: site.baseurl_root }}' alt="Twitter">
          </a>
          <a href="https://linkedin.com/in/{{ site.linkedin_pagename }}" target="_blank">
            <img class="icon-social" src='{{ "/assets/images/linkedin.png" | prepend: site.baseurl_root }}' alt="LinkedIn">
          </a>
          <a href="https://github.com/{{ site.github_pagename }}" target="_blank">
            <img class="icon-social" src='{{ "/assets/images/github.png" | prepend: site.baseurl_root }}' alt="GitHub">
          </a>
        </div>
      </div>

      <div style="border-top: 1px solid var(--border-muted); margin-top: 25px; padding-top: 20px;">
        <span style="font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); display: block; margin-bottom: 10px;">
          {% t contact.dm %}
        </span>
        <div style="display: flex; gap: 10px; align-items: center;">
          <input class="contact-field" style="margin-top: 0; padding: 6px 10px; font-size: 0.85em;" disabled placeholder="{% t contact.shortmessage %}" type="text">
          <button class="contact-btn" style="padding: 6px 15px; font-size: 0.8em;" disabled>{% t contact.send %}</button>
        </div>
        <span style="font-size: 0.75em; color: var(--text-secondary); display: block; margin-top: 5px;">
          {% t global.workinprogress %}
        </span>
      </div>
    </div>
    
    <div class="contact-footer" style="padding-left: 10px; line-height: 1.6; color: var(--text-secondary);">
      {% t contact.footer %}
    </div>
  </div>
</div>
