---
layout: home
title: pages.home
---

<div class="hud-layout" id="hud-container">
  <!-- SVG connections container -->
  <svg id="hud-svg" class="hud-connections" aria-hidden="true">
    <path id="path-info" class="hud-path" d="" />
    <path id="path-work" class="hud-path" d="" />
    <path id="path-contact" class="hud-path" d="" />
    <path id="path-music" class="hud-path" d="" />
  </svg>

  <!-- Node 01: Info -->
  <div class="hud-node top-left" id="node-info" onclick="animateAndGoToSection('info')">
    <div class="node-tag">01 //</div>
    <div class="node-label">{% t pages.info %}</div>
  </div>

  <!-- Node 02: Work -->
  <div class="hud-node top-right" id="node-work" onclick="animateAndGoToSection('work')">
    <div class="node-tag">02 //</div>
    <div class="node-label">{% t pages.work %}</div>
  </div>

  <!-- Central Identity -->
  <div class="hud-identity" id="main-identity">
    <div class="hud-logo-wrapper">
      <img class="logo-image" src="{{ "/assets/images/logo.png" | prepend: site.baseurl_root }}" alt="Valerio Libera Logo">
    </div>
    <div class="hud-info-box">
      <span class="terminal-blink">{% t home.description %}</span>
    </div>
  </div>

  <!-- Node 03: Contact -->
  <div class="hud-node bottom-left" id="node-contact" onclick="animateAndGoToSection('contact')">
    <div class="node-tag">03 //</div>
    <div class="node-label">{% t pages.contact %}</div>
  </div>

  <!-- Node 04: Music -->
  <div class="hud-node bottom-right" id="node-music" onclick="window.open('https://www.kloakarecords.it/', '_blank')">
    <div class="node-tag">04 //</div>
    <div class="node-label">{% t pages.music %}</div>
  </div>
</div>

<script>
  initParticles(null)
  corrupt_checkProbability(function(){
    initParticles(currentCorruptionProbability)
  })

  function drawConnections() {
    const svg = document.getElementById('hud-svg');
    if (!svg) return;
    const centerEl = document.getElementById('main-identity');
    const nodes = [
      { id: 'node-info', pathId: 'path-info' },
      { id: 'node-work', pathId: 'path-work' },
      { id: 'node-contact', pathId: 'path-contact' },
      { id: 'node-music', pathId: 'path-music' }
    ];
    if (!centerEl) return;
    
    // Hide paths on mobile viewports
    if (window.innerWidth <= 900) {
      nodes.forEach(node => {
        const pathEl = document.getElementById(node.pathId);
        if (pathEl) pathEl.setAttribute('d', '');
      });
      return;
    }
    
    const centerRect = centerEl.getBoundingClientRect();
    const containerRect = svg.getBoundingClientRect();
    
    const cx = centerRect.left - containerRect.left + centerRect.width / 2;
    const cy = centerRect.top - containerRect.top + centerRect.height / 2;
    
    nodes.forEach(node => {
      const nodeEl = document.getElementById(node.id);
      const pathEl = document.getElementById(node.pathId);
      if (!nodeEl || !pathEl) return;
      
      const nodeRect = nodeEl.getBoundingClientRect();
      const nx = nodeRect.left - containerRect.left + nodeRect.width / 2;
      const ny = nodeRect.top - containerRect.top + nodeRect.height / 2;
      
      // Draw circuit-style step connections
      pathEl.setAttribute('d', `M ${cx} ${cy} L ${nx} ${cy} L ${nx} ${ny}`);
    });
  }

  // Set up connection lines active states
  const connectionNodes = [
    { id: 'node-info', pathId: 'path-info' },
    { id: 'node-work', pathId: 'path-work' },
    { id: 'node-contact', pathId: 'path-contact' },
    { id: 'node-music', pathId: 'path-music' }
  ];
  
  connectionNodes.forEach(node => {
    const el = document.getElementById(node.id);
    if (el) {
      el.addEventListener('mouseenter', () => {
        const path = document.getElementById(node.pathId);
        if (path) path.classList.add('active');
      });
      el.addEventListener('mouseleave', () => {
        const path = document.getElementById(node.pathId);
        if (path) path.classList.remove('active');
      });
    }
  });

  window.addEventListener('resize', drawConnections);
  window.addEventListener('load', drawConnections);
  // Redraw when fonts load
  if (document.fonts) {
    document.fonts.ready.then(drawConnections);
  }
  setTimeout(drawConnections, 200);

  function animateAndGoToSection(section) {
    document.getElementById("main-home").addEventListener('animationend', () => {
      goToSection(section)
    });
    document.getElementById("main-home").classList.add("item-disappear")
  }

  function goToSection(section){
    window.open("{{ site.baseurl }}/" + section + "/", "_self");
  }
</script>
